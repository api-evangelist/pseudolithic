name: Pseudolithic
description: >-
  PseudolithIC is a semiconductor company specializing in heterogeneous
  integration technology for cost-effective, high-performance silicon RFICs
  (radio frequency integrated circuits). The company combines compound
  semiconductor chiplets with large-diameter, low-cost silicon wafers to
  deliver mm-wave power amplifiers, low-noise amplifiers, and transmit/receive
  (T/R) front-end modules for RF and wireless applications. PseudolithIC is a
  hardware/chipset manufacturer targeting the RF and semiconductor industries;
  it publishes no public developer API, SDKs, or programmatic surface. Surfaced
  as a portfolio company of Uncork Capital and profiled in the API Evangelist
  network.
